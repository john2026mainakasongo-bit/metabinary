<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />

    <!-- Primary SEO -->
    <title>MetaBinary | Online Trading Platform</title>

    <meta
      name="description"
      content="Trade global and synthetic markets with MetaBinary. Access advanced trading tools, automated strategies, trading bots, secure deposits, withdrawals, and account management."
    />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <meta name="author" content="MetaBinary" />

    <!-- Canonical -->
    <link rel="canonical" href="https://metabinaryfx.com/" />

    <!-- MetaBinary Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg?v=8"
    />

    <!-- Mobile / Browser -->
    <meta name="theme-color" content="#071321" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MetaBinary" />

    <meta
      property="og:title"
      content="MetaBinary | Online Trading Platform"
    />

    <meta
      property="og:description"
      content="Trade global and synthetic markets with advanced trading tools, automated strategies, bots, deposits, and withdrawals."
    />

    <meta property="og:url" content="https://metabinaryfx.com/" />

    <meta
      property="og:image"
      content="https://metabinaryfx.com/favicon.svg?v=8"
    />

    <!-- Twitter / Social -->
    <meta name="twitter:card" content="summary" />

    <meta
      name="twitter:title"
      content="MetaBinary | Online Trading Platform"
    />

    <meta
      name="twitter:description"
      content="Trade global and synthetic markets with MetaBinary."
    />

    <meta
      name="twitter:image"
      content="https://metabinaryfx.com/favicon.svg?v=8"
    />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "MetaBinary",
        "url": "https://metabinaryfx.com/"
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
