<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />

    <!-- Primary SEO -->
    <title>MetaBinary | Online Trading, Forex & Trading Bots</title>

    <meta
      name="description"
      content="MetaBinary is an online trading platform for forex trading, binary trading markets, automated trading bots, deposits, withdrawals, and account management."
    />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <meta name="author" content="MetaBinary" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://metabinaryfx.com/" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />

    <!-- Browser / Mobile -->
    <meta name="theme-color" content="#050b16" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MetaBinary" />
    <meta
      property="og:title"
      content="MetaBinary | Online Trading, Forex & Trading Bots"
    />
    <meta
      property="og:description"
      content="Explore MetaBinary for online trading, forex markets, binary trading, automated trading bots, deposits and withdrawals."
    />
    <meta property="og:url" content="https://metabinaryfx.com/" />

    <!-- Twitter / Social -->
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="MetaBinary | Online Trading Platform"
    />
    <meta
      name="twitter:description"
      content="Online forex trading, binary trading markets and automated trading bots with MetaBinary."
    />

    <!-- Site Name Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "MetaBinary",
        "alternateName": [
          "MetaBinaryFX",
          "Meta Binary",
          "MetaBinary Trading"
        ],
        "url": "https://metabinaryfx.com/"
      }
    </script>

    <!-- Organization Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "MetaBinary",
        "alternateName": "MetaBinaryFX",
        "url": "https://metabinaryfx.com/",
        "logo": "https://metabinaryfx.com/favicon.svg",
        "description": "MetaBinary is an online trading platform offering forex markets, binary trading markets and automated trading tools."
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
